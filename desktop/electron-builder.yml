appId: com.interviewmeet.desktop
productName: InterviewMeet
copyright: InterviewMeet
directories:
  output: dist
  buildResources: build
files:
  - src/**
  - app-dist/**
  - app-config.json
  - package.json
asar: true
# the address the browser uses to hand Google sign-in back to the app
protocols:
  - name: InterviewMeet
    schemes: [interviewmeet]
publish:
  provider: github
  owner: tobioyinlola
  repo: Interview
  releaseType: release
mac:
  category: public.app-category.productivity
  # fixed names so the website can link to the latest release without knowing the version
  artifactName: InterviewMeet-mac-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    # Without NSAudioCaptureUsageDescription macOS 14.2+ gives a silent stream with no error.
    NSAudioCaptureUsageDescription: InterviewMeet listens to your computer's sound so it can hear the interviewer and suggest answers.
    NSMicrophoneUsageDescription: InterviewMeet uses your microphone during live interviews.
    NSCameraUsageDescription: InterviewMeet does not use your camera.
win:
  signAndEditExecutable: false
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: InterviewMeet-Setup.exe
  oneClick: true
  perMachine: false
