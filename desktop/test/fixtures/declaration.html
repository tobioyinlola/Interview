<!doctype html><html><head><title>Apply</title></head><body>
<form method="post" action="/apply" enctype="multipart/form-data">
 <label for="first_name">First Name*</label><input id="first_name" name="first_name" required>
 <label for="email">Email*</label><input id="email" name="email" type="email" required>
 <label for="resume">Resume/CV*</label><input id="resume" name="resume" type="file">
 <fieldset><legend>Do you hold a security clearance?*</legend>
  <label><input type="radio" name="clearance" value="y" required>Yes</label>
  <label><input type="radio" name="clearance" value="n">No</label></fieldset>
 <button type="submit">Submit application</button>
</form></body></html>
