<!doctype html><html><head><title>Apply</title></head><body>
<form onsubmit="return false">
 <label for="first_name">First Name*</label><input id="first_name" name="first_name">
 <label for="email">Email*</label><input id="email" name="email" type="email">
 <label for="resume">Resume/CV*</label><input id="resume" name="resume" type="file">
 <div id="hidden-q"><label for="why">Why us?*</label><div id="why" contenteditable="true" style="border:1px solid #888;min-height:20px"></div></div>
 <p id="err" role="alert" hidden></p>
 <button type="submit" id="go" onclick="document.getElementById('err').hidden=false;document.getElementById('err').textContent='Missing entry for required field: Why us?'">Submit application</button>
</form></body></html>
