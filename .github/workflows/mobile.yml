name: mobile

# Builds the phone apps on GitHub's machines (this repo's sandbox cannot).
#  - Android: a debug APK you can download from the run page and install on a phone to try.
#    It is signed with a throwaway debug key, so it cannot go on the Play Store.
#  - A change to mobile/ or to the interface (frontend/) that lands on Staging publishes the Android app
#    to the download release by itself (version 0.2.<run number>). The app carries its own copy of the
#    interface, so a change to the website reaches phones through a new app version.
#  - iOS: a build for the simulator, to prove the project compiles. A real iPhone build and the
#    App Store need an Apple Developer account and signing certificates (see mobile/README.md).
on:
  push:
    paths: ["mobile/**", "frontend/**", "scripts/build-app-ui.js", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**", "frontend/**", "scripts/build-app-ui.js", ".github/workflows/mobile.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish the Android app to the download release (android-latest)"
        type: boolean
        default: false
      version:
        description: "Version number, like 0.1.0 (each release must be higher than the last)"
        type: string
        default: "0.1.0"

defaults:
  run:
    working-directory: mobile

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to publish the download
    env:
      APP_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || format('0.2.{0}', github.run_number) }}
      RELEASE: ${{ (github.event_name == 'workflow_dispatch' && inputs.release) || (github.event_name == 'push' && github.ref == 'refs/heads/Staging') }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the interface release compares with the commit of the last one
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm test
      # The app carries its own copy of the interface, so it opens instantly and works offline.
      - name: Build the interface that goes inside the app
        run: |
          npm ci --prefix ../frontend
          npm run build:web
        env:
          INTERVIEWMEET_URL: ${{ vars.INTERVIEWMEET_URL }}
          VITE_UI_VERSION: ${{ env.APP_VERSION }}   # what the running interface says it is
      - run: npx cap sync android
      # A real signing key (for the Play Store) goes in as repository secrets ANDROID_KEYSTORE_BASE64,
      # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD. Without them the app is
      # signed with a throwaway debug key, which is fine for installing on a phone to try it.
      # Android only installs an app over an older one if its build number is higher. This one grows with
      # every run, whatever the version text says.
      - name: Build number
        run: echo "APP_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Use the signing key, if there is one
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi
      - name: Build the app
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk InterviewMeet-android.apk
      # A phone installs an update only if it is signed with the same key as the app already on it.
      # Without the signing secrets every build gets a different throwaway key, so no phone can update
      # in place and people have to delete the app and install again.
      - name: Say which signing key was used
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs InterviewMeet-android.apk | tee signer.txt
          if [ -z "$ANDROID_KEYSTORE_FILE" ]; then
            echo "::warning title=Throwaway signing key::No signing key is set (secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). Phones cannot update this build in place."
          else
            echo "Signed with the fixed key. Its fingerprint must be the same in every run."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: InterviewMeet-android
          path: mobile/InterviewMeet-android.apk
          if-no-files-found: error
      # The download button on the website points at a release with a fixed name, so it never goes
      # stale and never competes with the desktop releases for "latest".
      - name: Publish the download
        if: env.RELEASE == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          REL_REPO: ${{ secrets.RELEASES_TOKEN && 'tobioyinlola/interviewmeet-downloads' || github.repository }}
          REL_TARGET: ${{ secrets.RELEASES_TOKEN && 'main' || github.sha }}
        run: |
          gh release view android-latest --repo "$REL_REPO" >/dev/null 2>&1 || \
            gh release create android-latest --repo "$REL_REPO" --prerelease --target "$REL_TARGET" \
              --title "InterviewMeet for Android" --notes "placeholder"
          gh release upload android-latest mobile/InterviewMeet-android.apk --repo "$REL_REPO" --clobber
          gh release edit android-latest --repo "$REL_REPO" --prerelease \
            --title "InterviewMeet for Android $APP_VERSION" \
            --notes "Android app, version $APP_VERSION. Open the file on your phone and allow installs from this source if asked. Android may say the app is from an unknown developer: it is not signed for the Play Store yet."
      # The same interface that is inside the app, as a download the installed apps fetch by themselves,
      # check, and switch to on a restart: no reinstall. The note says which build is the oldest that can
      # run it (see mobile/scripts/ui-release.js).
      - name: Publish the interface for installed apps
        if: env.RELEASE == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          REL_REPO: ${{ secrets.RELEASES_TOKEN && 'tobioyinlola/interviewmeet-downloads' || github.repository }}
          REL_TARGET: ${{ secrets.RELEASES_TOKEN && 'main' || github.sha }}
        run: |
          (cd mobile/www && zip -qr ../interface.zip .)
          PREV=$(gh release view interface-latest --repo "$REL_REPO" --json body --jq .body 2>/dev/null || echo "")
          PREV_COMMIT=$(echo "$PREV" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).commit||"")}catch{console.log("")}})')
          if [ -n "$PREV_COMMIT" ] && git cat-file -e "$PREV_COMMIT^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$PREV_COMMIT" "$GITHUB_SHA")
          else
            CHANGED="UNKNOWN"
          fi
          NOTE=$(cd mobile && node scripts/ui-release.js "$APP_VERSION" "$APP_VERSION_CODE" "$PREV" $CHANGED)
          echo "Interface note: $NOTE"
          gh release view interface-latest --repo "$REL_REPO" >/dev/null 2>&1 || \
            gh release create interface-latest --repo "$REL_REPO" --prerelease --target "$REL_TARGET" \
              --title "InterviewMeet interface" --notes "placeholder"
          gh release upload interface-latest mobile/interface.zip --repo "$REL_REPO" --clobber
          gh release edit interface-latest --repo "$REL_REPO" --prerelease \
            --title "InterviewMeet interface $APP_VERSION" --notes "$NOTE"

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            frontend/package-lock.json
      - run: npm ci
      # The app carries its own copy of the interface, so it opens instantly and works offline.
      - name: Build the interface that goes inside the app
        run: |
          npm ci --prefix ../frontend
          npm run build:web
        env:
          INTERVIEWMEET_URL: ${{ vars.INTERVIEWMEET_URL }}
      - run: npx cap sync ios
      - name: Build for the simulator (unsigned)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
