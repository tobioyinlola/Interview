name: desktop

# Tests and builds the desktop app on real Windows and Mac machines.
#  - Any change to desktop/ (or a manual run): tests, and a Windows installer you can download from
#    the run page under "Artifacts" (unsigned, for trying out).
#  - A change to desktop/ that lands on Staging: builds the Windows and Mac installers and publishes them
#    as a new release by itself (version 0.2.<run number>). Installed Windows apps find it and update
#    themselves. Changes to the website itself need no release: the apps load the live site.
#  - A tag like desktop-v0.1.0: builds Mac and Windows installers and attaches them to a GitHub release,
#    which is also where the app looks for updates.
on:
  push:
    # Branch pushes need `branches` named here: with only `tags` listed, GitHub ignores ordinary pushes.
    branches: [Staging]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
    tags: ["desktop-v*"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release (and the tag desktop-v<version>) when the build passes"
        type: boolean
        default: false
      version:
        description: "Version number for the release, like 0.1.0 (only used when releasing)"
        type: string
        default: "0.1.0"
      mac:
        description: "Also build the Mac app (a download on the run page; attached to the release too when releasing)"
        type: boolean
        default: false

defaults:
  run:
    working-directory: desktop

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write   # needed to create the release and its tag
    env:
      RELEASE: ${{ (github.event_name == 'workflow_dispatch' && inputs.release) || (github.event_name == 'push' && github.ref == 'refs/heads/Staging') }}
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || format('0.2.{0}', github.run_number) }}
    steps:
      - name: Check the version before building
        if: env.RELEASE == 'true'
        shell: bash
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must look like 0.1.0"; exit 1; }
          if gh release view "desktop-v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release desktop-v$VERSION already exists. Use a new version."; exit 1
          fi
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: npm ci
      - run: npm test
      # Starts the real app from source and checks what the page can and cannot do.
      - run: npm run smoke
      # Signing: set repository secrets CSC_LINK (base64 .pfx) and CSC_KEY_PASSWORD. Without them
      # the installer is built UNSIGNED and Windows SmartScreen warns before running it.
      - name: Build installer
        shell: bash
        run: |
          EXTRA=""
          if [ "$RELEASE" = "true" ]; then EXTRA="--config.extraMetadata.version=$VERSION"; fi
          npx electron-builder --win nsis --x64 $EXTRA --publish ${{ startsWith(github.ref, 'refs/tags/desktop-v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      # The same checks again, this time against the packaged app that people would install.
      - name: Smoke test the packaged app
        run: npm run smoke
        env:
          SMOKE_EXE: ${{ github.workspace }}\desktop\dist\win-unpacked\InterviewMeet.exe
      - uses: actions/upload-artifact@v4
        with:
          name: InterviewMeet-windows
          path: desktop/dist/*.exe
          if-no-files-found: error
      # The "Release" button: tag this commit and publish the installer, only after every check above
      # passed. latest.yml and the .blockmap are what the installed app uses to update itself.
      - name: Publish release
        if: env.RELEASE == 'true'
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la desktop/dist
          FILES="desktop/dist/InterviewMeet-Setup.exe"
          for extra in desktop/dist/latest.yml desktop/dist/InterviewMeet-Setup.exe.blockmap; do
            if [ -f "$extra" ]; then FILES="$FILES $extra"; else echo "note: $extra was not produced"; fi
          done
          gh release create "desktop-v$VERSION" $FILES \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "InterviewMeet desktop $VERSION (Windows)" \
            --notes "Windows installer. It is not code-signed yet, so Windows may show a protected-your-PC notice: choose More info, then Run anyway."
          # The website's download buttons point at ONE fixed release, so they work whichever build is
          # newest and never wait for the Mac build. (It is a pre-release so it is never "latest", which
          # is the release installed apps look at for updates.)
          gh release view desktop-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create desktop-latest --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
              --title "InterviewMeet downloads" --notes "placeholder"
          gh release upload desktop-latest desktop/dist/InterviewMeet-Setup.exe --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit desktop-latest --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "InterviewMeet downloads" \
            --notes "The newest installers, at fixed addresses for the website. Windows: $VERSION. Not code-signed yet."

  mac:
    # Mac installers: on request ("Also build the Mac app"), for every automatic release on Staging, and
    # for tagged releases.
    if: ${{ always() && needs.windows.result == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.mac) || (github.event_name == 'push' && github.ref == 'refs/heads/Staging') || startsWith(github.ref, 'refs/tags/desktop-v')) }}
    needs: windows
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      RELEASE: ${{ (github.event_name == 'workflow_dispatch' && inputs.release) || (github.event_name == 'push' && github.ref == 'refs/heads/Staging') }}
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || format('0.2.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: npm ci
      - run: npm test
      # Starts the real app and checks what the page can and cannot do. Computer-audio capture is
      # skipped: a CI Mac cannot grant the screen-recording permission it needs.
      - run: npm run smoke
        env:
          SMOKE_SKIP_CAPTURE: "1"
      # Signing and notarization secrets: CSC_LINK (base64 .p12), CSC_KEY_PASSWORD, APPLE_ID,
      # APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID. Without them the app is built UNSIGNED, and a Mac
      # will refuse to open it until the person right-clicks it and chooses Open.
      - name: Build Mac app
        run: |
          # GitHub passes a missing secret as an EMPTY variable, and electron-builder reads an empty
          # CSC_LINK as a file name. Remove the signing variables entirely when there is no certificate.
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          EXTRA=""
          if [ "$RELEASE" = "true" ]; then EXTRA="--config.extraMetadata.version=$VERSION"; fi
          npx electron-builder --mac $EXTRA --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - run: ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: InterviewMeet-mac
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
          if-no-files-found: error
      - name: Attach to the release
        if: env.RELEASE == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "desktop-v$VERSION" desktop/dist/*.dmg desktop/dist/*.zip --repo "$GITHUB_REPOSITORY" --clobber
          # and the fixed download release the website links to (see the Windows job)
          gh release view desktop-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create desktop-latest --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
              --title "InterviewMeet downloads" --notes "placeholder"
          gh release upload desktop-latest desktop/dist/*.dmg --repo "$GITHUB_REPOSITORY" --clobber
