name: desktop

# Tests and builds the desktop app on real Windows and Mac machines.
#  - Any change to desktop/ (or a manual run): tests, and a Windows installer you can download from
#    the run page under "Artifacts" (unsigned, for trying out).
#  - A tag like desktop-v0.1.0: builds Mac and Windows installers and attaches them to a GitHub release,
#    which is also where the app looks for updates.
on:
  push:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
    tags: ["desktop-v*"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: desktop

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: npm ci
      - run: npm test
      # Starts the real app from source and checks what the page can and cannot do.
      - run: npm run smoke
      # Signing: set repository secrets CSC_LINK (base64 .pfx) and CSC_KEY_PASSWORD. Without them
      # the installer is built UNSIGNED and Windows SmartScreen warns before running it.
      - name: Build installer
        run: npx electron-builder --win nsis --x64 --publish ${{ startsWith(github.ref, 'refs/tags/desktop-v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      # The same checks again, this time against the packaged app that people would install.
      - name: Smoke test the packaged app
        run: npm run smoke
        env:
          SMOKE_EXE: ${{ github.workspace }}\desktop\dist\win-unpacked\InterviewMeet.exe
      - uses: actions/upload-artifact@v4
        with:
          name: InterviewMeet-windows
          path: desktop/dist/*.exe
          if-no-files-found: error

  mac:
    # Mac installers are built only for releases, until the Windows app has been tried.
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: npm ci
      - run: npm test
      # Signing and notarization secrets: CSC_LINK (base64 .p12), CSC_KEY_PASSWORD, APPLE_ID,
      # APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID. Without them the build is unsigned.
      - run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
