name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: meetpractice }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/meetpractice
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/meetpractice_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: api/pyproject.toml }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app evals loadtest
      - name: Create test database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE meetpractice_test'
      - run: pytest -q
      - name: Migration check (throwaway database)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check  # models and migrations must not drift
      - name: OpenAPI drift check
        run: |
          python scripts/export_openapi.py /tmp/openapi.json
          diff -u ../web/openapi.json /tmp/openapi.json
      - run: pip-audit

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - name: Generated API types must match the schema
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  images:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t meet-api ./api
      - run: docker build -t meet-web ./web
      # Fail on fixable HIGH or CRITICAL vulnerabilities in either image.
      - uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: meet-api, severity: "HIGH,CRITICAL", ignore-unfixed: true, exit-code: "1" }
      - uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: meet-web, severity: "HIGH,CRITICAL", ignore-unfixed: true, exit-code: "1" }

  # Real-browser test of the live session against the PRODUCTION build and its strict
  # Content-Security-Policy, with scripted (fake) transcription and answers. No OpenAI key needed.
  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: meetpractice }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/meetpractice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: api/pyproject.toml }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: python -m venv api/.venv && api/.venv/bin/pip install -e "api/.[dev]"
      - run: npm ci
        working-directory: web
      - run: npm install -g playwright@1 && playwright install --with-deps chromium
      - run: E2E_PROD=1 ./scripts/e2e-live.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: e2e-output, path: "${{ runner.temp }}/e2e", if-no-files-found: ignore }
