[project]
name = "meet-practice-api"
version = "0.1.0"
description = "FastAPI backend for the Meet Practice Assistant"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy[asyncio]>=2.0.30,<3",
  "asyncpg>=0.29,<1",
  "alembic>=1.13,<2",
  "httpx>=0.27,<1",
  "defusedxml>=0.7,<1",
  "openai>=1.40,<3",
  "email-validator>=2.2,<3",
  "trafilatura>=1.12,<3",
  "websockets>=13,<17",
  "prometheus-client>=0.20,<1",
  "pypdf>=5,<7",
  "cryptography>=43,<50",
]

[project.optional-dependencies]
sentry = ["sentry-sdk>=2,<3"]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=0.23,<2",
  "ruff>=0.5",
  "mypy>=1.10",
  "pip-audit>=2.7",
  "trustme>=1.1",
  "types-defusedxml>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ASYNC", "E501"]
"alembic/versions/*" = ["E501", "I001", "Q"]
"evals/*" = ["E501", "S311"]  # long data strings; a seeded shuffle for sampling, not security
"app/services/email_templates.py" = ["E501"]  # HTML and email copy read better unwrapped
"loadtest/*" = ["S", "ASYNC", "BLE"]  # a test client run by hand, not served code

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sentry_sdk", "sentry_sdk.*"]  # optional dependency
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
