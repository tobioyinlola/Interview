server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # SPA fallback
  location / { try_files $uri /index.html; }
  # Strict CSP: this app renders text only and talks to its own API (tighten API origin per env).
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "display-capture=(self), microphone=(self)" always;
}
